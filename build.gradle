plugins {
    id 'java-library'
	id 'maven-publish'
	id 'signing'
	id 'net.thebugmc.gradle.sonatype-central-portal-publisher' version "1.2.4"
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

group = 'org.javafn'
version = "${major}.${minor}.${patch}"

java {
    withJavadocJar()
    withSourcesJar()
}

repositories {
    mavenLocal()
    mavenCentral()
}

def generatedMainJava = layout.buildDirectory.dir("generated/main/java")

tasks.register('genSrc', JavaExec) {
	group = 'code generation'
	description = 'Generates source code'
	classpath = sourceSets.codeGen.runtimeClasspath
	mainClass = 'org.javafn.codeGen.GenerateCore'
	outputs.dir(generatedMainJava)
	workingDir = projectDir
	args generatedMainJava.get().asFile.absolutePath, sourceCompatibility.toString()
}

sourceSets {
	codeGen {
		java.srcDir 'src/genSrc/java'
	}
	main {
		java.srcDir(tasks.named('genSrc'))
	}
}

tasks.named('compileJava') { dependsOn tasks.named('genSrc') }

dependencies {
	compileOnly("com.github.spotbugs:spotbugs-annotations:4.9.+")
	implementation('org.javafn:javafn-utils:0.1.+')
	testImplementation(platform('org.junit:junit-bom:6.1.+'))
	testImplementation('org.junit.jupiter:junit-jupiter')
	testRuntimeOnly('org.junit.platform:junit-platform-launcher')

	codeGenImplementation 'com.github.javaparser:javaparser-core:3.26.2'
}

centralPortal {
	username = System.getenv("OSSRH_SONATYPE_USERNAME")
	password = System.getenv("OSSRH_SONATYPE_PASSWORD")

	pom {
		name = 'JavaFn'
		description = '''\
			|Additional functional tools for Java.
			|Adds support for Result and Either algebraic types.
			|Includes a set of static Try methods that return Results so that checked exceptions
			|can be used in streams seamlessly.
			|Finally, includes Pair, Trio, and Quad tuples that work well with streams.
			|'''.stripMargin().replaceAll("\n", " ")
		url = 'https://github.com/javafn-org/javafn'
		scm {
			connection = 'scm:git:git://github.com:javafn-org/javafn.git'
			developerConnection = 'scm:git:ssh://git@github.com:javafn-org/javafn.git'
			url = 'https://github.com/javafn-org/javafn'
		}
		licenses {
			license {
				name = 'BSD-3-Clause'
				url = 'https://opensource.org/license/BSD-3-clause/'
			}
		}
		developers {
			developer {
				id = 'ben-stringer'
				name = 'Ben Stringer'
				email = 'ben.stringer.jr@javafn.org'
			}
			developer {
				id = 'Archthebald'
				name = 'Dakota Maulding'
				email = ''
			}
			developer {
				id = 'TrevorPatorno'
				name = 'Trevor Patorno'
				email = ''
			}
			developer {
				id = 'nichipedia'
				name = 'Nicholas Moran'
				email = ''
			}
		}
	}
}

signing {
	useGpgCmd()
	project.ext.set('signing.gnupg.executable', 'gpg')
	project.ext.set('signing.gnupg.keyName', System.getenv("OSSRH_GPG_ID"))
	project.ext.set('signing.gnupg.passphrase', System.getenv("OSSRH_GPG_SECRET_KEY_PASSWORD"))
}

tasks.withType(Sign) {
	onlyIf { System.getenv().containsKey("CI") }
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
	}
}